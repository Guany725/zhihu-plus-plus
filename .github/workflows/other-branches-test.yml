name: Lite Release
on:
  push:
    branches: [build/lite-release-20261031]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build optimized Lite Release
        env:
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI_BUILD_MINIFY: 'true'
        run: |
          if [ -z "$signingKey" ]; then
            unset signingKey keyAlias keyStorePassword keyPassword
          fi
          bash ./gradlew :app:assembleLiteRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Lite Release
          path: |
            app/build/outputs/apk/lite/release/*.apk
            app/build/outputs/apk/lite/release/output-metadata.json
          if-no-files-found: error
